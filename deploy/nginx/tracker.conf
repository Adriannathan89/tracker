# Install as /etc/nginx/sites-available/tracker. Add HTTPS with Certbot after enabling.
# Host Nginx forwards the original URI to Docker's frontend Nginx.
# The frontend serves Angular and routes /api/* to the Rust backend.
server {
    listen 80;
    listen [::]:80;
    server_name tracker.adrianportofolio.my.id;

    access_log /var/log/nginx/tracker.access.log;
    error_log /var/log/nginx/tracker.error.log;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
